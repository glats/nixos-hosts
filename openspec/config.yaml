# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: NixOS Flakes + Home Manager + sops-nix + nix-darwin + nixos-hardware
  Architecture: Multi-host (rog, thinkcentre, t14, mact2). Modular profiles via modules/{base,desktop,features,hardware,networking,virtualisation}/. Host entry points in hosts/{hostname}/default.nix. Flake entry in flake.nix with lib/mkHost.nix for generation.
  Testing: No unit test runner (NixOS config). Validation via `nix flake check --no-build` (syntax) and `nixos-build` (build + switch). Format via `format-nix`.
  Style: Nix language, declarative, modular. All code in English. Never edit hardware-configuration.nix. nixfmt formatting.

testing:
  strict_tdd: false
  detected: 2026-07-01
  runner:
    command: nix flake check --no-build
    framework: Nix Flakes built-in validation (syntax + option validation)
    note: NixOS configuration — no conventional unit test runner; validated at build time
  layers:
    unit:
      available: false
      tool: "—"
    integration:
      available: false
      tool: "—"
    e2e:
      available: false
      tool: "—"
  coverage:
    available: false
    command: "—"
  quality:
    linter:
      available: true
      command: nix flake check --no-build (syntax/option validation); statix (Nix anti-pattern linting)
    type_checker:
      available: false
      command: "—" (Nix is dynamically typed; nil provides LSP analysis, not static checks)
    formatter:
      available: true
      command: nixfmt (via format-nix or nix fmt -- <path>)
    dead_code:
      available: true
      command: deadnix (available as package, not part of CI pipeline)

rules:
  proposal:
    - Include rollback plan for risky changes (nixos-build safe)
    - Reference affected hosts when change is host-specific
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Reference NixOS options when configuring services
  design:
    - Document which hosts are affected
    - Include option paths for new NixOS/HM configs
    - Reference existing module patterns
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Include verification steps in each task
  apply:
    - Follow existing module patterns in modules/ and hosts/
    - Run `format-nix` after edits
    tdd: false
    test_command: nix flake check --no-build
  verify:
    test_command: nix flake check --no-build
    build_command: nixos-build dry
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Update openspec/specs/ with archived deltas
