# Glats theme — hyprlock configuration
#
# Deployed to ~/.config/omarchy/themes/glats/hyprlock.conf by
# hosts/t14/home/omarchy.nix. Hyprlock reads this file from the
# active theme directory at lock-screen launch.
#
# Glats palette (monochrome, accent-only):
#   bg          #000000
#   fg          #dddddd
#   accent      #0d73cc
#   selection   #505050
#   dim         #8a8a8a

general {
  hide_cursor = true
  grace = 0
  no_fade_in = false
}

background {
  monitor =
  path = screenshot
  blur_passes = 3
  blur_size = 8
  brightness = 0.5
}

input-field {
  monitor =
  size = 300, 50
  outline_thickness = 2
  dots_size = 0.25
  dots_spacing = 0.15
  fade_on_empty = true
  placeholder_text = <i>Password...</i>
  fail_text = <i>Failure</i>
  position = 0, -20
  halign = center
  valign = center
}

label {
  monitor =
  text = $TIME
  color = #dddddd
  font_size = 90
  font_family = CaskaydiaCove Nerd Font
  position = 0, 200
  halign = center
  valign = center
  shadow {
    enabled = true
    range = 4
    color = rgba(0, 0, 0, 0.5)
  }
}

label {
  monitor =
  text = $USER
  color = #8a8a8a
  font_size = 24
  font_family = CaskaydiaCove Nerd Font
  position = 0, 100
  halign = center
  valign = center
  shadow {
    enabled = true
    range = 2
    color = rgba(0, 0, 0, 0.5)
  }
}
