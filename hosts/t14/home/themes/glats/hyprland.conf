# Glats theme — Hyprland decoration overrides
#
# Deployed to ~/.config/omarchy/themes/glats/hyprland.conf by
# hosts/t14/home/omarchy.nix. Omarchy's theme-switcher sources this
# file to override the default decoration / animation / blur settings.
#
# Colours mirror the glats Waybar palette (16-color, base16-inspired).
# These are decoration-only overrides; the structural input/output
# config lives in hosts/t14/home/hypr/{input,monitors,looknfeel,...}.nix.

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  col.active_border = rgba(137, 180, 250, 200) rgba(166, 227, 161, 200) 45deg
  col.inactive_border = rgba(49, 50, 68, 100)
  layout = dwindle
  allow_tearing = false
}

decoration {
  rounding = 8
  blur {
    enabled = true
    size = 4
    passes = 2
  }
  shadow {
    enabled = true
    range = 8
    render_power = 2
    color = rgba(0, 0, 0, 0.4)
  }
}

animations {
  enabled = true
  bezier = easeOutQuint
  animation = windows
}
