# Glats theme — mako notification daemon config
#
# Deployed to ~/.config/omarchy/themes/glats/mako.ini by
# hosts/t14/home/omarchy.nix. Omarchy's mako config file is a
# symlink to ~/.config/omarchy/current/theme/mako.ini (see
# /nix/store/.../hm_mako.ini in the deployed home-manager-files),
# so the active theme's mako.ini is what the notification daemon
# reads at startup.
#
# Glats palette (monochrome, accent-only):
#   bg          #000000
#   fg          #dddddd
#   accent      #0d73cc
#   selection   #505050
#   dim         #8a8a8a
#
# Only the four mako options called out in the spec are set here
# (background, text, border, progress).  The defaults that omarchy
# ships via its include (=~/.local/share/omarchy/default/mako/core.ini)
# cover font, geometry, timeouts, etc., and we want to inherit those
# rather than fork a complete config.
include=~/.local/share/omarchy/default/mako/core.ini

background-color=#000000
text-color=#dddddd
border-color=#0d73cc
progress-color=#0d73cc
